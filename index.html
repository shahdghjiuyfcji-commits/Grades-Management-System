<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج</title>
    <!-- ربط مكتبة Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <h1 class="text-center mb-4 text-primary fw-bold">نظام إدارة النتائج والتفوق الدراسي</h1>

        <div class="row">
            <!-- قسم إدخال بيانات الطالب -->
            <div class="col-md-5 mb-4">
                <div class="card shadow p-4">
                    <h4 class="mb-3 text-secondary">إضافة طالب جديد</h4>
                    
                    <!-- صندوق رسائل الخطأ (مخفي افتراضياً) -->
                    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                    <div class="mb-3">
                        <label for="studentName" class="form-label">اسم الطالب</label>
                        <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
                    </div>

                    <div class="mb-3">
                        <label for="grade1" class="form-label">درجة المادة الأولى</label>
                        <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="grade2" class="form-label">درجة المادة الثانية</label>
                        <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="grade3" class="form-label">درجة المادة الثالثة</label>
                        <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
                    </div>

                    <div class="mb-3">
                        <label for="attendance" class="form-label">نسبة الحضور (%)</label>
                        <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
                    </div>

                    <button id="addBtn" class="btn btn-primary w-100 mb-2">إضافة طالب</button>
                    <button id="mercyBtn" class="btn btn-warning text-white w-100">تفعيل لجنة الرأفة</button>
                </div>
            </div>

            <!-- قسم عرض القوائم والتقارير -->
            <div class="col-md-7">
                <!-- قائمة الطلاب المضافين -->
                <div class="card shadow p-4 mb-4">
                    <h4 class="mb-3 text-secondary">قائمة الطلاب المسجلين</h4>
                    <div id="studentsListBox" class="border p-3 rounded bg-white" style="min-height: 120px; max-height: 200px; overflow-y: auto;">
                        <p class="text-muted text-center m-0">لم يتم إضافة طلاب بعد...</p>
                    </div>
                </div>

                <!-- تقرير لجنة الرأفة -->
                <div class="card shadow p-4">
                    <h4 class="mb-3 text-secondary">التقرير النهائي للجنة الرأفة</h4>
                    <div id="reportBox" class="border p-3 rounded bg-white" style="min-height: 120px;">
                        <p class="text-muted text-center m-0">لم يتم تفعيل لجنة الرأفة بعد...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ربط ملف الجافا سكريبت الخارجي -->
    <script src="js/main.js"></script>
</body>
</html>
